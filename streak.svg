<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink'
     style='isolation: isolate' viewBox='0 0 495 195' width='495px' height='195px' direction='ltr'>
  <style>
    @keyframes currstreak {
      0%   { font-size: 3px;  opacity: 0.2; }
      80%  { font-size: 34px; opacity: 1; }
      100% { font-size: 28px; opacity: 1; }
    }
    @keyframes fadein { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes chama {
      0%   { transform: scale(1);    opacity: 0.88; }
      50%  { transform: scale(1.09); opacity: 1; }
      100% { transform: scale(1);    opacity: 0.88; }
    }
  </style>
  <defs>
    <clipPath id='outer_rectangle'><rect width='495' height='195' rx='4.5'/></clipPath>
    <mask id='mask_out_ring_behind_fire'>
      <rect width='495' height='195' fill='white'/>
      <ellipse id='mask-ellipse' cx='247.5' cy='32' rx='13' ry='18' fill='black'/>
    </mask>
  </defs>
  <g clip-path='url(#outer_rectangle)'>
    <rect stroke='none' fill='#0D1117' rx='4.5' x='0.5' y='0.5' width='494' height='194'/>

    <line x1='165' y1='28' x2='165' y2='170' vector-effect='non-scaling-stroke'
          stroke-width='1' stroke='#1B4332' stroke-linecap='square'/>
    <line x1='330' y1='28' x2='330' y2='170' vector-effect='non-scaling-stroke'
          stroke-width='1' stroke='#1B4332' stroke-linecap='square'/>

    <!-- Total de contribuicoes -->
    <g transform='translate(82.5, 48)'><text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#FEFEFE' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 0.6s'>2.290</text></g>
    <g transform='translate(82.5, 84)'><text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#CDE8D5' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='14px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 0.7s'>Contribuições totais</text></g>
    <g transform='translate(82.5, 114)'><text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#7FBF9B' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 0.8s'>11 out 2025 - hoje</text></g>

    <!-- Sequencia atual -->
    <g mask='url(#mask_out_ring_behind_fire)'>
      <circle cx='247.5' cy='71' r='40' fill='none' stroke='#52B788' stroke-width='5'
              style='opacity: 0; animation: fadein 0.5s linear forwards 0.4s'/>
    </g>
    <g transform='translate(247.5, 19.5)'>
     <g style='transform-origin: 0px 11px; animation: chama 2.4s ease-in-out infinite'>
      <path d='M 1.5 0.67 C 1.5 0.67 2.24 3.32 2.24 5.47 C 2.24 7.53 0.89 9.2 -1.17 9.2
               C -3.23 9.2 -4.79 7.53 -4.79 5.47 L -4.76 5.11 C -6.78 7.51 -8 10.62 -8 13.99
               C -8 18.41 -4.42 22 0 22 C 4.42 22 8 18.41 8 13.99 C 8 8.6 5.41 3.79 1.5 0.67 Z
               M -0.29 19 C -2.07 19 -3.51 17.6 -3.51 15.86 C -3.51 14.24 -2.46 13.1 -0.68 12.74
               C 1.1 12.38 2.94 11.53 3.97 10.15 C 4.36 11.44 4.57 12.8 4.57 14.19
               C 4.57 16.85 2.41 19 -0.29 19 Z'
            fill='#95D5B2' stroke-opacity='0'/>
     </g>
    </g>
    <g transform='translate(247.5, 48)'><text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#FEFEFE' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' font-style='normal' style='animation: currstreak 0.6s linear forwards'>1</text></g>
    <g transform='translate(247.5, 108)'><text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#52B788' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='14px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 0.9s'>Sequência atual</text></g>
    <g transform='translate(247.5, 145)'><text x='0' y='21' stroke-width='0' text-anchor='middle' fill='#7FBF9B' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 0.9s'>5 set 2026</text></g>

    <!-- Maior sequencia -->
    <g transform='translate(412.5, 48)'><text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#FEFEFE' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 1.2s'>41</text></g>
    <g transform='translate(412.5, 84)'><text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#CDE8D5' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='14px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 1.3s'>Maior sequência</text></g>
    <g transform='translate(412.5, 114)'><text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#7FBF9B' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 1.4s'>21 jul - 30 ago 2026</text></g>
  </g>
</svg>
